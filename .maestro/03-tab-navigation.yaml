# Authenticated tab navigation. REQUIRES a signed-in dev build with a test
# account: run this flow only on a Beta device gate session, never in CI.
# appId is a placeholder: Beta replaces it with the real Android application
# identifier before any device run. Emulator execution stays Beta-owned.
appId: com.strandcue.dev
---
- launchApp
- assertVisible: "Your Hair Passport"
- tapOn: "Shelf"
- assertVisible: "My Shelf"
- tapOn: "Tools"
- assertVisible: "My Tools"
- tapOn: "Settings"
- assertVisible: "Account"
