# Authenticated tab navigation. REQUIRES a signed-in dev build with a test
# account: run this flow only on a Beta device gate session, never in CI.
# appId is the D2-decided Android application identifier (za.co.strandcue.app).
# Emulator execution stays Beta-owned.
appId: za.co.strandcue.app
---
- launchApp
- assertVisible: "Your Hair Passport"
- tapOn: "Shelf"
- assertVisible: "My Shelf"
- tapOn: "Tools"
- assertVisible: "My Tools"
- tapOn: "Settings"
- assertVisible: "Account"
