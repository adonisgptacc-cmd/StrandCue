name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run audit:control-plane
      - run: npm run check:expo
      - run: npm run export:web
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies

  supabase-api:
    name: supabase-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.117.0
      - name: Replay migrations in a disposable local stack
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            echo 'Local Supabase startup failed; inspect the disposable runner services without publishing credential-bearing CLI output.'
            exit 1
          }
          supabase db reset --local
      - name: Test real Auth and PostgREST ownership boundaries
        env:
          STRANDCUE_SUPABASE_API_TEST: '1'
        run: |
          set -euo pipefail
          status="$(supabase status -o json)"
          export STRANDCUE_SUPABASE_URL="$(jq -r '.API_URL' <<< "$status")"
          export STRANDCUE_SUPABASE_PUBLISHABLE_KEY="$(jq -r '.ANON_KEY' <<< "$status")"
          export STRANDCUE_SUPABASE_SECRET_KEY="$(jq -r '.SERVICE_ROLE_KEY' <<< "$status")"
          echo "::add-mask::$STRANDCUE_SUPABASE_SECRET_KEY"
          npm test -- --run tests/database/supabase-api.test.ts
      - name: Stop disposable services
        if: always()
        run: supabase stop --no-backup

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed content and history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
