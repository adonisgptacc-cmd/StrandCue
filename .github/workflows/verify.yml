name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run audit:control-plane
      - run: npm run check:expo
      - run: npm run export:web
      - name: Check website routes in a local preview
        env:
          STRANDCUE_WEBSITE_ORIGIN: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --config website/wrangler.jsonc --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/strandcue-website-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 --output /dev/null "$STRANDCUE_WEBSITE_ORIGIN/"; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Local website preview did not become ready.'
            tail -n 40 "$RUNNER_TEMP/strandcue-website-preview.log"
            exit 1
          fi
          npm run check:website
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies

  supabase-api:
    name: supabase-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Replay migrations in a disposable local stack
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            echo 'Local Supabase startup failed; inspect the disposable runner services without publishing credential-bearing CLI output.'
            exit 1
          }
          supabase db reset --local
      - name: Test real Auth and PostgREST ownership boundaries
        env:
          STRANDCUE_SUPABASE_API_TEST: '1'
        run: |
          set -euo pipefail
          status="$(supabase status -o json)"
          export STRANDCUE_SUPABASE_URL="$(jq -r '.API_URL' <<< "$status")"
          export STRANDCUE_SUPABASE_PUBLISHABLE_KEY="$(jq -r '.ANON_KEY' <<< "$status")"
          export STRANDCUE_SUPABASE_SECRET_KEY="$(jq -r '.SERVICE_ROLE_KEY' <<< "$status")"
          echo "::add-mask::$STRANDCUE_SUPABASE_SECRET_KEY"
          npm test -- --run tests/database/supabase-api.test.ts
      - name: Prove real PostgreSQL concurrency on the disposable stack
        run: |
          set -euo pipefail
          status="$(supabase status -o json)"
          dsn="$(jq -er '.DB_URL | select(type == "string" and length > 0)' <<< "$status")"
          dsn="$(printf '%s' "$dsn" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => { raw += chunk; });
            process.stdin.on("end", () => {
              let url;
              try { url = new URL(raw); } catch {
                console.error("Local PostgreSQL proof received an invalid database URL.");
                process.exitCode = 1;
                return;
              }
              if (!["postgres:", "postgresql:"].includes(url.protocol) || url.search
                || !["127.0.0.1", "localhost"].includes(url.hostname)) {
                console.error("Local PostgreSQL proof requires a loopback database.");
                process.exitCode = 1;
                return;
              }
              url.username = "supabase_admin";
              process.stdout.write(url.toString());
            });
          ')"
          export STRANDCUE_PG_DSN="$dsn"
          echo "::add-mask::$STRANDCUE_PG_DSN"
          node -e '
            const { Client } = require("pg");
            (async () => {
              const client = new Client({ connectionString: process.env.STRANDCUE_PG_DSN });
              try {
                await client.connect();
                const result = await client.query("select rolsuper from pg_roles where rolname=current_user");
                if (result.rows[0]?.rolsuper !== true) throw new Error("not superuser");
              } finally { await client.end(); }
            })().catch(() => {
              console.error("Local PostgreSQL proof requires a disposable superuser connection.");
              process.exitCode = 1;
            });
          '
          suite_paths=(tests/database/*concurrency.pg.test.ts tests/database/engine-ruleset-successor-publication.pg.test.ts)
          npm test -- --run "${suite_paths[@]}" \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/strandcue-pg-results.json"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const suites = result.testResults ?? [];
            const expected = new Set(process.argv.slice(2).map(value => path.resolve(value)));
            const observed = new Set(suites.map(suite => path.resolve(suite.name)));
            if (expected.size === 0 || suites.length !== expected.size || result.numPassedTests === 0
              || result.numPendingTests !== 0 || result.numTodoTests !== 0
              || [...expected].some(value => !observed.has(value))
              || suites.some(suite => suite.status !== "passed"
                || !suite.assertionResults?.some(assertion => assertion.status === "passed"))) {
              console.error("Real PostgreSQL concurrency proof was skipped or incomplete.");
              process.exit(1);
            }
            console.log(`Real PostgreSQL concurrency proof passed: ${suites.length} suites, ${result.numPassedTests} tests.`);
          ' "$RUNNER_TEMP/strandcue-pg-results.json" "${suite_paths[@]}"
      - name: Stop disposable services
        if: always()
        run: supabase stop --no-backup

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed content and history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
