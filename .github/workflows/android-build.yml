name: Android Build & Release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - playInternal

permissions:
  contents: read
  packages: write

env:
  GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  ANDROID_HOME: /opt/android-sdk
  JAVA_VERSION: 17

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  build-android:
    name: Build Android (${{ github.event.inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-typecheck, test]
    if: github.event_name != 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        build_type: [debug, release, playInternal]
        include:
          - build_type: debug
            gradle_task: assembleDebug
          - build_type: release
            gradle_task: assembleRelease
          - build_type: playInternal
            gradle_task: bundlePlayInternalRelease
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: latest
          emulator: false

      - name: Decode Keystore
        if: ${{ matrix.build_type != 'debug' && env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "keystore.jks decoded to $(pwd)/keystore.jks"

      - name: Configure Gradle Signing
        if: ${{ matrix.build_type != 'debug' && env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat >> android/gradle.properties << EOF
          ANDROID_KEYSTORE_PATH=$(pwd)/keystore.jks
          ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build Android
        working-directory: ./android
        run: ./gradlew ${{ matrix.gradle_task }} --no-daemon --stacktrace

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.build_type }}-${{ github.sha }}
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          retention-days: 7

  deploy-play-internal:
    name: Deploy to Play Internal Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-android
    if: github.event.inputs.build_type == 'playInternal' || github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: android-playInternal-${{ github.sha }}
          path: ./aab

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./android

      - name: Deploy to Play Internal Testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          cd android
          bundle exec fastlane internal

  audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Control Plane Audit
        run: npm run audit:control-plane

      - name: Dependency Audit
        run: npm run audit:dependencies

  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export Web
        run: npm run export:web