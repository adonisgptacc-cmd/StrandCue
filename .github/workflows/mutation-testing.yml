name: Mutation Testing

on:
  workflow_dispatch:

permissions: {}

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies
      # Optional diagnostic: the isolated runner is lockfile-pinned and runs only when explicitly requested.
      - run: npm ci --ignore-scripts --prefix tools/mutation-runner
      - run: node tools/mutation-runner/node_modules/@stryker-mutator/core/bin/stryker.js run
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30
