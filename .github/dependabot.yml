version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-compatible:
        patterns: ['expo', 'expo-*', '@expo/*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /workers/account-deletion
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]
